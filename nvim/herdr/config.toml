# herdr config - see `herdr --default-config` for every option.
# Installed by nvim/install.sh for herdr-srun workbenches on Bunya. Only
# written when absent - edit ~/.config/herdr/config.toml freely afterwards.

[keys]
# Same prefix as ~/.tmux.conf. The default ctrl+b collides with Claude Code,
# which uses ctrl+b to background a running command.
prefix = "ctrl+a"

[session]
# When a workbench job ends (walltime or --end) and you start it again, reopen
# each Claude pane into its previous conversation. Needs the integration:
# `herdr integration install claude` (once; it adds a SessionStart hook to
# ~/.claude/settings.json that does nothing outside herdr).
resume_agents_on_restore = true
